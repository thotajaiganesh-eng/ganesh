<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <!-- Add Task -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task"
            >

            <button id="addBtn">Add Task</button>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button id="loadBtn">
                Load Tasks from API
            </button>

            <button id="clearBtn">
                Clear All
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
